name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests (no API)
        run: |
          uv run pytest tests/test_config.py tests/test_models.py tests/test_email_parser.py tests/test_priority.py tests/test_calendar_store.py tests/test_ics_export.py -v

      - name: Run integration tests
        if: env.ZAI_API_KEY != ''
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          uv run pytest tests/ -v
