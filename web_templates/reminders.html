{% extends "base.html" %}
{% block title %}Reminders{% endblock %}
{% block content %}

<div class="grid-3">
    <!-- Urgent Emails -->
    <div class="card">
        <div class="card-header"><h3>Urgent Emails</h3></div>
        <div class="card-body"
             hx-get="/api/reminders/partial?section=urgent"
             hx-trigger="load, every 30s"
             hx-swap="innerHTML">
            <div class="htmx-indicator"><div class="spinner"></div></div>
        </div>
    </div>

    <!-- Upcoming Deadlines -->
    <div class="card">
        <div class="card-header"><h3>Upcoming Deadlines</h3></div>
        <div class="card-body"
             hx-get="/api/reminders/partial?section=deadlines"
             hx-trigger="load, every 60s"
             hx-swap="innerHTML">
            <div class="htmx-indicator"><div class="spinner"></div></div>
        </div>
    </div>

    <!-- Today's Schedule -->
    <div class="card">
        <div class="card-header"><h3>Today's Schedule</h3></div>
        <div class="card-body"
             hx-get="/api/reminders/partial?section=today"
             hx-trigger="load, every 60s"
             hx-swap="innerHTML">
            <div class="htmx-indicator"><div class="spinner"></div></div>
        </div>
    </div>
</div>

{% endblock %}
