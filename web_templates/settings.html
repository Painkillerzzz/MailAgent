{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block extra_head %}
<script defer src="/static/js/settings.js"></script>
{% endblock %}

{% block content %}
<div x-data="settingsApp" x-init="loadSettings()">

    <template x-if="!loaded">
        <div class="text-center" style="padding: 3rem;"><div class="spinner"></div> Loading settings...</div>
    </template>

    <template x-if="loaded">
        <div>
            <!-- LLM Configuration -->
            <div class="card">
                <div class="card-header"><h3>LLM Configuration</h3></div>
                <div class="card-body">
                    <div class="form-row">
                        <div class="form-group">
                            <label>API Key</label>
                            <input type="password" x-model="settings.llm.api_key" placeholder="Enter ZhipuAI API key">
                        </div>
                        <div class="form-group">
                            <label>Model</label>
                            <select x-model="settings.llm.model">
                                <option value="glm-5">GLM-5</option>
                                <option value="glm-4-plus">GLM-4-Plus</option>
                                <option value="glm-4-flash">GLM-4-Flash</option>
                                <option value="glm-4-air">GLM-4-Air</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Temperature: <span x-text="settings.llm.temperature"></span></label>
                            <input type="range" min="0" max="1" step="0.1" x-model="settings.llm.temperature">
                        </div>
                        <div class="form-group">
                            <label>Max Tokens</label>
                            <input type="number" x-model.number="settings.llm.max_tokens" min="128" max="8192">
                        </div>
                    </div>
                    <button class="btn btn-secondary" @click="testLLM()" :disabled="testing.llm">
                        <span x-show="!testing.llm">Test API Key</span>
                        <span x-show="testing.llm"><span class="spinner" style="width:14px;height:14px;border-width:2px;"></span> Testing...</span>
                    </button>
                    <span class="mt-1" style="margin-left: 0.5rem; font-size: 0.85rem;"
                          x-show="testResults.llm" x-text="testResults.llm"
                          :class="testResults.llmOk ? 'text-success' : 'text-error'"></span>
                </div>
            </div>

            <!-- IMAP Configuration -->
            <div class="card">
                <div class="card-header"><h3>IMAP Email Configuration</h3></div>
                <div class="card-body">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Host</label>
                            <input type="text" x-model="settings.imap.host" placeholder="imap.gmail.com">
                        </div>
                        <div class="form-group">
                            <label>Port</label>
                            <input type="number" x-model.number="settings.imap.port" placeholder="993">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Username</label>
                            <input type="text" x-model="settings.imap.username" placeholder="your_email@gmail.com">
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" x-model="settings.imap.password" placeholder="App password">
                        </div>
                    </div>
                    <button class="btn btn-secondary" @click="testIMAP()" :disabled="testing.imap">
                        <span x-show="!testing.imap">Test Connection</span>
                        <span x-show="testing.imap"><span class="spinner" style="width:14px;height:14px;border-width:2px;"></span> Testing...</span>
                    </button>
                    <span class="mt-1" style="margin-left: 0.5rem; font-size: 0.85rem;"
                          x-show="testResults.imap" x-text="testResults.imap"
                          :class="testResults.imapOk ? 'text-success' : 'text-error'"></span>
                </div>
            </div>

            <!-- User Profile -->
            <div class="card">
                <div class="card-header"><h3>User Profile</h3></div>
                <div class="card-body">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" x-model="settings.user.name" placeholder="Your name">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" x-model="settings.user.email" placeholder="your@email.com">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Reply Tone</label>
                        <select x-model="settings.user.tone">
                            <option value="polite and concise">Polite and Concise</option>
                            <option value="formal and academic">Formal and Academic</option>
                            <option value="friendly and warm">Friendly and Warm</option>
                            <option value="casual">Casual</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Email Signature</label>
                        <textarea x-model="settings.user.signature" placeholder="--&#10;Your Name&#10;Title"></textarea>
                    </div>
                </div>
            </div>

            <!-- Google Account (placeholder) -->
            <div class="card">
                <div class="card-header"><h3>Google Account</h3></div>
                <div class="card-body">
                    <p class="text-muted mb-1">Google Calendar sync will be available in a future update.</p>
                    <button class="btn btn-secondary" disabled>Connect Google Account</button>
                </div>
            </div>

            <!-- Save -->
            <div style="text-align: right; margin-top: 1rem;">
                <button class="btn btn-primary btn-lg" @click="saveSettings()" :disabled="saving">
                    <span x-show="!saving">Save Settings</span>
                    <span x-show="saving"><span class="spinner" style="width:14px;height:14px;border-width:2px;"></span> Saving...</span>
                </button>
            </div>
        </div>
    </template>

</div>
{% endblock %}
