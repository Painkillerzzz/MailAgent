{% if results %}
{% for r in results %}
<div class="reminder-item">
    <div style="display: flex; align-items: center; gap: 0.5rem;">
        <span class="badge badge-{{ r.priority.level.value }}">{{ r.priority.level.value }}</span>
        <strong style="font-size: 0.9rem;">{{ r.email.subject }}</strong>
    </div>
    <div class="reminder-meta">来自：{{ r.email.sender_name or r.email.sender }}</div>
    <div style="font-size: 0.85rem; margin-top: 0.25rem;">{{ r.analysis.summary }}</div>
</div>
{% endfor %}
{% else %}
<p class="text-muted" style="text-align:center; padding:1rem;">暂无紧急邮件</p>
{% endif %}
