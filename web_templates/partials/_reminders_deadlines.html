{% if results %}
{% for r in results %}
<div class="reminder-item">
    <strong style="font-size: 0.9rem;">{{ r.email.subject }}</strong>
    <div class="reminder-meta">来自：{{ r.email.sender_name or r.email.sender }}</div>
    <div style="font-size: 0.85rem; color: var(--color-warning); margin-top: 0.25rem;">
        截止：{{ r.analysis.schedule_description }}
    </div>
</div>
{% endfor %}
{% else %}
<p class="text-muted" style="text-align:center; padding:1rem;">暂无即将到期</p>
{% endif %}
