{% if events %}
{% for evt in events %}
<div class="reminder-item">
    <strong style="font-size: 0.9rem;">{{ evt.title }}</strong>
    <div style="font-size: 0.85rem; color: var(--color-primary); margin-top: 0.25rem;">
        {{ evt.start_time.strftime('%H:%M') }} &ndash; {{ evt.end_time.strftime('%H:%M') }}
    </div>
    {% if evt.attendees %}
    <div class="reminder-meta">{{ evt.attendees | join(', ') }}</div>
    {% endif %}
</div>
{% endfor %}
{% else %}
<p class="text-muted" style="text-align:center; padding:1rem;">今日暂无日程</p>
{% endif %}
