{% extends "base.html" %}
{% block title %}邮件{% endblock %}
{% block content %}

<!-- 拉取并展示邮件 -->
<div class="card" style="margin-bottom: 1rem;" x-data="fetchPanel" x-init="loadStatus()">
    <div class="card-header">
        <h3>拉取邮件</h3>
        <span class="gstatus" :class="status.authorized ? 'gstatus-ok' : 'gstatus-off'"
              x-text="statusLabel()"></span>
    </div>
    <div class="card-body">
        <p class="text-muted mb-1">
            从邮箱拉取未读邮件，自动生成<strong>摘要 · 优先级 · 日程安排 · 回复草稿</strong>并在下方展示。
        </p>
        <template x-if="status.enabled && !status.authorized">
            <p class="text-error mb-1">Google 未授权，请在终端运行 <code>uv run mail-agent auth</code>。</p>
        </template>
        <div class="form-row" style="align-items:flex-end;">
            <div class="form-group" style="max-width:140px;">
                <label for="fetch-limit">拉取数量</label>
                <input id="fetch-limit" type="number" x-model.number="opts.limit" min="1" max="50">
            </div>
            <div class="form-group" style="align-self:flex-end;">
                <button class="btn btn-primary" @click="fetchEmails()" :disabled="fetching">
                    <span x-show="!fetching">拉取并展示</span>
                    <span x-show="fetching"><span class="spinner" style="width:14px;height:14px;border-width:2px;"></span> 处理中…</span>
                </button>
                <span style="margin-left:0.6rem; font-size:0.85rem;" x-text="lastResult"
                      :class="lastOk ? 'text-success' : 'text-error'"></span>
            </div>
        </div>
    </div>
</div>

<div class="grid-2" style="margin-bottom: 1rem;">
    <!-- 演示 -->
    <div class="card">
        <div class="card-header"><h3>演示</h3></div>
        <div class="card-body">
            <p class="text-muted mb-1">处理 3 封示例邮件，快速预览代理效果。</p>
            <button class="btn btn-primary"
                    hx-post="/api/demo"
                    hx-swap="none"
                    hx-on::after-request="if(event.detail.successful){ showToast('已处理演示邮件', 'success'); htmx.ajax('GET', '/api/emails/partial', '#email-list'); } else { showToast('演示处理失败', 'error'); }">
                运行演示
            </button>
        </div>
    </div>

    <!-- 分析邮件 -->
    <div class="card" x-data="{ showForm: false }">
        <div class="card-header" style="cursor:pointer" role="button" tabindex="0"
             :aria-expanded="showForm" @click="showForm = !showForm"
             @keydown.enter.prevent="showForm = !showForm" @keydown.space.prevent="showForm = !showForm">
            <h3>分析邮件</h3>
            <span x-text="showForm ? '−' : '+'" style="font-size:1.2rem;" aria-hidden="true"></span>
        </div>
        <div class="card-body" x-show="showForm" x-cloak>
            <form hx-post="/api/emails/process"
                  hx-swap="none"
                  hx-on::after-request="if(event.detail.successful){ showToast('分析完成', 'success'); htmx.ajax('GET', '/api/emails/partial', '#email-list'); this.reset(); } else { showToast('分析失败', 'error'); }">
                <div class="form-row">
                    <div class="form-group">
                        <label for="an-sender-name">发件人姓名</label>
                        <input id="an-sender-name" type="text" name="sender_name" placeholder="李教授">
                    </div>
                    <div class="form-group">
                        <label for="an-sender">发件人邮箱</label>
                        <input id="an-sender" type="email" name="sender" placeholder="lee@university.edu" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="an-subject">主题</label>
                    <input id="an-subject" type="text" name="subject" placeholder="会议邀约" required>
                </div>
                <div class="form-group">
                    <label for="an-body">正文</label>
                    <textarea id="an-body" name="body" placeholder="邮件正文…" required></textarea>
                </div>
                <button type="submit" class="btn btn-success">分析</button>
            </form>
        </div>
    </div>
</div>

<!-- 筛选栏 -->
<div class="filter-bar"
     hx-get="/api/emails/partial"
     hx-trigger="change, keyup changed delay:300ms from:find input[name='search']"
     hx-target="#email-list"
     hx-swap="innerHTML"
     hx-include="find select, find input">
    <label>紧急度</label>
    <select name="urgency" aria-label="按紧急度筛选">
        <option value="">全部</option>
        <option value="critical">紧急</option>
        <option value="high">高</option>
        <option value="medium">中</option>
        <option value="low">低</option>
    </select>

    <label>分类</label>
    <select name="category" aria-label="按分类筛选">
        <option value="">全部</option>
        <option value="meeting">会议</option>
        <option value="task">任务</option>
        <option value="cooperation">合作</option>
        <option value="notification">通知</option>
        <option value="social">社交</option>
        <option value="other">其他</option>
    </select>

    <label>排序</label>
    <select name="sort_by" aria-label="排序字段">
        <option value="priority">优先级</option>
        <option value="date">日期</option>
    </select>
    <select name="order" aria-label="排序方向">
        <option value="desc">降序</option>
        <option value="asc">升序</option>
    </select>

    <input type="text" name="search" placeholder="搜索…" aria-label="搜索邮件"
           style="flex:1; min-width:120px;">
</div>

<!-- 邮件列表 -->
<div id="email-list"
     hx-get="/api/emails/partial"
     hx-trigger="load, refresh"
     hx-swap="innerHTML">
    <div class="htmx-indicator"><div class="spinner"></div> 加载中…</div>
</div>

{% endblock %}
