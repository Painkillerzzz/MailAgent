{% extends "base.html" %}
{% block title %}Emails{% endblock %}
{% block content %}

<!-- 拉取并展示邮件 -->
<div class="card" style="margin-bottom: 1rem;" x-data="fetchPanel" x-init="loadStatus()">
    <div class="card-header">
        <h3>拉取邮件</h3>
        <span class="gstatus" :class="status.authorized ? 'gstatus-ok' : 'gstatus-off'"
              x-text="statusLabel()"></span>
    </div>
    <div class="card-body">
        <p class="text-muted mb-1">
            从邮箱拉取未读邮件，自动生成<strong>摘要 · 优先级 · 日程安排 · 回复草稿</strong>并在下方展示。
        </p>
        <template x-if="status.enabled && !status.authorized">
            <p class="text-error mb-1">Google 未授权，请在终端运行 <code>uv run mail-agent auth</code>。</p>
        </template>
        <div class="form-row" style="align-items:flex-end;">
            <div class="form-group" style="max-width:140px;">
                <label>拉取数量</label>
                <input type="number" x-model.number="opts.limit" min="1" max="50">
            </div>
            <div class="form-group" style="align-self:flex-end;">
                <button class="btn btn-primary" @click="fetchEmails()" :disabled="fetching">
                    <span x-show="!fetching">拉取并展示</span>
                    <span x-show="fetching"><span class="spinner" style="width:14px;height:14px;border-width:2px;"></span> 处理中...</span>
                </button>
                <span style="margin-left:0.6rem; font-size:0.85rem;" x-text="lastResult"
                      :class="lastOk ? 'text-success' : 'text-error'"></span>
            </div>
        </div>
    </div>
</div>

<div class="grid-2" style="margin-bottom: 1rem;">
    <!-- Run Demo -->
    <div class="card">
        <div class="card-header"><h3>Demo</h3></div>
        <div class="card-body">
            <p class="text-muted mb-1">Process 3 sample emails to see the agent in action.</p>
            <button class="btn btn-primary"
                    hx-post="/api/demo"
                    hx-target="#email-list"
                    hx-swap="innerHTML"
                    hx-on::after-request="if(event.detail.successful) { showToast('Demo processed', 'success'); htmx.ajax('GET', '/api/emails/partial', '#email-list'); }">
                Run Demo
            </button>
        </div>
    </div>

    <!-- Analyze Email -->
    <div class="card" x-data="{ showForm: false }">
        <div class="card-header" style="cursor:pointer" @click="showForm = !showForm">
            <h3>Analyze Email</h3>
            <span x-text="showForm ? '−' : '+'" style="font-size:1.2rem;"></span>
        </div>
        <div class="card-body" x-show="showForm" x-cloak>
            <form hx-post="/api/emails/process"
                  hx-target="#email-list"
                  hx-swap="innerHTML"
                  hx-on::after-request="if(event.detail.successful) { showToast('Analysis complete', 'success'); htmx.ajax('GET', '/api/emails/partial', '#email-list'); }">
                <div class="form-row">
                    <div class="form-group">
                        <label>Sender Name</label>
                        <input type="text" name="sender_name" placeholder="Prof. Lee">
                    </div>
                    <div class="form-group">
                        <label>Sender Email</label>
                        <input type="email" name="sender" placeholder="lee@university.edu" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Subject</label>
                    <input type="text" name="subject" placeholder="Meeting request" required>
                </div>
                <div class="form-group">
                    <label>Body</label>
                    <textarea name="body" placeholder="Email body..." required></textarea>
                </div>
                <button type="submit" class="btn btn-success">Analyze</button>
            </form>
        </div>
    </div>
</div>

<!-- Filter Bar -->
<div class="filter-bar"
     hx-get="/api/emails/partial"
     hx-trigger="change from:find select, change from:find input"
     hx-target="#email-list"
     hx-swap="innerHTML"
     hx-include="find select, find input">
    <label>Urgency</label>
    <select name="urgency">
        <option value="">All</option>
        <option value="critical">Critical</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
    </select>

    <label>Category</label>
    <select name="category">
        <option value="">All</option>
        <option value="meeting">Meeting</option>
        <option value="task">Task</option>
        <option value="cooperation">Cooperation</option>
        <option value="notification">Notification</option>
        <option value="social">Social</option>
        <option value="other">Other</option>
    </select>

    <label>Sort</label>
    <select name="sort_by">
        <option value="priority">Priority Score</option>
        <option value="date">Date</option>
    </select>
    <select name="order">
        <option value="desc">Desc</option>
        <option value="asc">Asc</option>
    </select>

    <input type="text" name="search" placeholder="Search..." style="flex:1; min-width:120px;"
           hx-trigger="keyup changed delay:300ms">
</div>

<!-- Email List -->
<div id="email-list"
     hx-get="/api/emails/partial"
     hx-trigger="load, refresh"
     hx-swap="innerHTML">
    <div class="htmx-indicator"><div class="spinner"></div> Loading...</div>
</div>

{% endblock %}
