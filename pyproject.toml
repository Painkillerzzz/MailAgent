[project]
name = "mail-agent"
version = "0.2.0"
description = "基于大模型的智能邮件管理代理系统"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "zhipuai>=2.1",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "python-dateutil>=2.9",
    "icalendar>=6.0",
    "typer>=0.15",
    "rich>=13.0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "jinja2>=3.1",
    "httpx>=0.28",
    "sniffio>=1.3.1",
    "python-multipart>=0.0.26",
]

[project.scripts]
mail-agent = "mail_agent.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mail_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
]
